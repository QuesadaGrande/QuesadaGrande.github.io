<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7fb">
    <title>Aftelkalender</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --bg-top: #fbfcff;
        --bg-bottom: #edf1f8;
        --glow: rgba(0, 122, 255, 0.18);
        --panel: rgba(255, 255, 255, 0.82);
        --panel-strong: #ffffff;
        --text: #101828;
        --muted: #667085;
        --hairline: rgba(16, 24, 40, 0.11);
        --blue: #007aff;
        --blue-soft: #e6f1ff;
        --green: #34c759;
        --pink: #ff2d55;
        --shadow: 0 18px 50px rgba(30, 41, 59, 0.14);
        --radius: 22px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      }

      body[data-theme="dark"] {
        color-scheme: dark;
        --bg: #111827;
        --bg-top: #182131;
        --bg-bottom: #080c14;
        --glow: rgba(10, 132, 255, 0.22);
        --panel: rgba(31, 41, 55, 0.76);
        --panel-strong: #263244;
        --text: #f8fafc;
        --muted: #a7b0c0;
        --hairline: rgba(255, 255, 255, 0.12);
        --blue: #0a84ff;
        --blue-soft: rgba(10, 132, 255, 0.16);
        --shadow: 0 18px 54px rgba(0, 0, 0, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 22% -8%, var(--glow), transparent 32rem),
          linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 48%, var(--bg-bottom) 100%);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      .app {
        width: min(100%, 520px);
        min-height: 100svh;
        margin: 0 auto;
        padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 2px 18px;
      }

      .top-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 10px;
        align-items: center;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .add-button,
      .theme-button,
      .icon-button {
        display: grid;
        place-items: center;
        border: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .theme-button {
        position: relative;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.62);
        color: #344054;
        box-shadow: inset 0 0 0 1px rgba(16, 24, 40, 0.08);
        backdrop-filter: blur(18px);
      }

      body[data-theme="dark"] .theme-button {
        background: rgba(255, 255, 255, 0.09);
        color: #f8fafc;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      .theme-button .sun-icon,
      body[data-theme="dark"] .theme-button .moon-icon {
        display: block;
      }

      .theme-button .moon-icon,
      body[data-theme="dark"] .theme-button .sun-icon {
        display: none;
      }

      .add-button {
        flex: 0 0 auto;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.72);
        color: var(--blue);
        box-shadow: inset 0 0 0 1px rgba(0, 122, 255, 0.16), 0 12px 30px rgba(0, 122, 255, 0.12);
        backdrop-filter: blur(18px);
      }

      .add-button:active,
      .theme-button:active,
      .primary:active,
      .secondary:active,
      .icon-button:active {
        transform: scale(0.97);
      }

      .summary {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
        min-height: 142px;
        padding: 22px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(22px);
      }

      .summary-label {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .summary-title {
        margin: 0;
        font-size: 23px;
        line-height: 1.16;
      }

      .summary-date {
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      .day-badge {
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        border-radius: 28px;
        background: linear-gradient(160deg, var(--blue) 0%, #45c2ff 100%);
        color: white;
        box-shadow: 0 18px 34px rgba(0, 122, 255, 0.28);
      }

      .day-number {
        font-size: 34px;
        font-weight: 800;
        line-height: 1;
      }

      .day-word {
        margin-top: 3px;
        font-size: 13px;
        font-weight: 700;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 24px 2px 10px;
      }

      h2 {
        margin: 0;
        font-size: 18px;
      }

      .count {
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }

      .event-list {
        display: grid;
        gap: 10px;
      }

      .event-card {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--hairline);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.74);
        backdrop-filter: blur(18px);
        cursor: pointer;
        text-align: left;
      }

      .event-card.is-past {
        border-color: rgba(255, 45, 85, 0.18);
        background: rgba(255, 242, 245, 0.82);
      }

      body[data-theme="dark"] .event-card {
        border-color: rgba(255, 255, 255, 0.11);
        background: rgba(31, 41, 55, 0.82);
      }

      body[data-theme="dark"] .event-card.is-past {
        border-color: rgba(255, 69, 100, 0.24);
        background: rgba(80, 35, 48, 0.54);
      }

      .event-card:focus-visible {
        outline: 0;
        border-color: rgba(0, 122, 255, 0.55);
        box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.12);
      }

      .date-tile {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 16px;
        background: var(--panel-strong);
        box-shadow: inset 0 0 0 1px rgba(16, 24, 40, 0.06);
      }

      body[data-theme="dark"] .date-tile {
        background: rgba(15, 23, 42, 0.92);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }

      body[data-theme="dark"] .date-month {
        color: #ff8fa3;
      }

      body[data-theme="dark"] .date-day {
        color: #f8fafc;
      }

      .date-month {
        color: var(--pink);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .date-day {
        margin-top: 1px;
        font-size: 24px;
        font-weight: 800;
        line-height: 1;
      }

      .event-title {
        margin: 0;
        overflow-wrap: anywhere;
        font-size: 16px;
        font-weight: 750;
      }

      .event-meta {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .days-left {
        min-width: 58px;
        padding: 8px 9px;
        border-radius: 14px;
        background: var(--blue-soft);
        color: #0057c2;
        text-align: center;
      }

      .days-left strong {
        display: block;
        font-size: 20px;
        line-height: 1;
      }

      .days-left span {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        font-weight: 750;
      }

      .event-card.is-past .days-left {
        background: #ffe8ed;
        color: #b42318;
      }

      body[data-theme="dark"] .days-left {
        background: rgba(10, 132, 255, 0.2);
        color: #8ec5ff;
      }

      body[data-theme="dark"] .event-card.is-past .days-left {
        background: rgba(255, 69, 100, 0.18);
        color: #ffb3c0;
      }

      .event-card.is-past .event-meta {
        color: #9f4b5d;
      }

      body[data-theme="dark"] .event-card.is-past .event-meta {
        color: #e5a0ad;
      }

      .empty {
        padding: 26px 18px;
        border: 1px dashed rgba(102, 112, 133, 0.34);
        border-radius: 20px;
        color: var(--muted);
        text-align: center;
        background: rgba(255, 255, 255, 0.48);
      }

      .backdrop {
        position: fixed;
        inset: 0;
        display: none;
        align-items: end;
        justify-content: center;
        padding: 14px;
        background: rgba(17, 24, 39, 0.22);
        backdrop-filter: blur(8px);
      }

      body[data-theme="dark"] .backdrop {
        background: rgba(3, 7, 18, 0.42);
      }

      .backdrop[data-open="true"] {
        display: flex;
      }

      .sheet {
        width: min(100%, 488px);
        padding: 10px 16px 18px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.22);
      }

      body[data-theme="dark"] .sheet {
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(22, 29, 42, 0.96);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.46);
      }

      .grabber {
        width: 42px;
        height: 5px;
        margin: 0 auto 12px;
        border-radius: 999px;
        background: #d0d5dd;
      }

      .sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .sheet h3 {
        margin: 0;
        font-size: 20px;
      }

      .icon-button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #eef1f6;
        color: #344054;
      }

      body[data-theme="dark"] .icon-button {
        background: rgba(255, 255, 255, 0.09);
        color: #e5e7eb;
      }

      label {
        display: block;
        margin: 14px 0 7px;
        color: #475467;
        font-size: 13px;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 50px;
        border: 1px solid rgba(16, 24, 40, 0.12);
        border-radius: 16px;
        outline: 0;
        padding: 0 14px;
        background: #f8fafc;
        color: var(--text);
        font-size: 16px;
      }

      body[data-theme="dark"] input {
        border-color: rgba(255, 255, 255, 0.13);
        background: rgba(255, 255, 255, 0.06);
      }

      input:focus {
        border-color: rgba(0, 122, 255, 0.55);
        box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
      }

      .form-error {
        display: none;
        margin: 12px 2px 0;
        color: #b42318;
        font-size: 13px;
        font-weight: 650;
      }

      .form-error[data-visible="true"] {
        display: block;
      }

      .form-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      .primary,
      .secondary,
      .danger {
        min-height: 50px;
        border: 0;
        border-radius: 16px;
        cursor: pointer;
        font-weight: 750;
      }

      .primary {
        background: var(--blue);
        color: #fff;
      }

      .secondary {
        background: #eef1f6;
        color: #344054;
      }

      body[data-theme="dark"] .secondary {
        background: rgba(255, 255, 255, 0.09);
        color: #e5e7eb;
      }

      .danger {
        display: none;
        width: 100%;
        margin-top: 10px;
        background: #fff1f0;
        color: #b42318;
      }

      body[data-theme="dark"] .danger {
        background: rgba(255, 69, 100, 0.14);
        color: #ffb3c0;
      }

      .danger[data-visible="true"] {
        display: block;
      }

      @media (max-width: 380px) {
        h1 {
          font-size: 30px;
        }

        .summary {
          grid-template-columns: 1fr;
        }

        .day-badge {
          width: 100%;
          height: 82px;
          border-radius: 20px;
        }

        .event-card {
          grid-template-columns: 52px minmax(0, 1fr);
        }

        .days-left {
          grid-column: 2;
          width: fit-content;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="todayLabel"></p>
          <h1>Aftelkalender</h1>
        </div>
        <div class="top-actions">
          <button class="theme-button" id="themeToggle" type="button" aria-label="Donkere modus inschakelen">
            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.4 15.2A8.4 8.4 0 0 1 8.8 3.6 8.4 8.4 0 1 0 20.4 15.2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.41M17.66 6.34l1.41-1.41" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="add-button" id="openSheet" type="button" aria-label="Nieuwe gebeurtenis toevoegen">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="summary" aria-live="polite">
        <div>
          <p class="summary-label">Eerstvolgend</p>
          <h2 class="summary-title" id="nextTitle">Nog niets gepland</h2>
          <p class="summary-date" id="nextDate">Voeg je eerste datum toe met de plusknop.</p>
        </div>
        <div class="day-badge" id="nextBadge">
          <span class="day-number">0</span>
          <span class="day-word">dagen</span>
        </div>
      </section>

      <div class="section-header">
        <h2>Gebeurtenissen</h2>
        <span class="count" id="eventCount">0 items</span>
      </div>

      <section class="event-list" id="eventList" aria-label="Aftelgebeurtenissen"></section>
    </main>

    <div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <form class="sheet" id="eventForm">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-head">
          <h3 id="sheetTitle">Nieuwe gebeurtenis</h3>
          <button class="icon-button" id="closeSheet" type="button" aria-label="Sluiten">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <label for="eventName">Naam</label>
        <input id="eventName" name="name" type="text" placeholder="Bijvoorbeeld vakantie" maxlength="48" autocomplete="off" required>

        <label for="eventDate">Datum</label>
        <input id="eventDate" name="date" type="date" required>

        <p class="form-error" id="formError" role="alert"></p>

        <div class="form-actions">
          <button class="secondary" id="cancelSheet" type="button">Annuleer</button>
          <button class="primary" id="submitButton" type="submit">Voeg toe</button>
        </div>
        <button class="danger" id="deleteEvent" type="button" data-visible="false">Verwijder gebeurtenis</button>
      </form>
    </div>

    <script>
      const storageKey = "aftelkalender.events.v1";
      const themeKey = "aftelkalender.theme.v1";
      const formatter = new Intl.DateTimeFormat("nl-NL", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      const shortMonth = new Intl.DateTimeFormat("nl-NL", { month: "short" });
      const themeToggle = document.querySelector("#themeToggle");
      const todayLabel = document.querySelector("#todayLabel");
      const nextTitle = document.querySelector("#nextTitle");
      const nextDate = document.querySelector("#nextDate");
      const nextBadge = document.querySelector("#nextBadge");
      const eventCount = document.querySelector("#eventCount");
      const eventList = document.querySelector("#eventList");
      const backdrop = document.querySelector("#backdrop");
      const form = document.querySelector("#eventForm");
      const eventName = document.querySelector("#eventName");
      const eventDate = document.querySelector("#eventDate");
      const formError = document.querySelector("#formError");
      const sheetTitle = document.querySelector("#sheetTitle");
      const submitButton = document.querySelector("#submitButton");
      const deleteEventButton = document.querySelector("#deleteEvent");

      let events = loadEvents();
      let lastRenderedDay = dayStamp(new Date());
      let editingEventId = null;
      let currentTheme = loadTheme();

      applyTheme(currentTheme);

      function loadEvents() {
        try {
          return JSON.parse(localStorage.getItem(storageKey)) || [];
        } catch {
          return [];
        }
      }

      function saveEvents() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(events));
          return true;
        } catch {
          return false;
        }
      }

      function loadTheme() {
        try {
          const savedTheme = localStorage.getItem(themeKey);
          if (savedTheme === "dark" || savedTheme === "light") return savedTheme;
        } catch {
          return "light";
        }

        return "light";
      }

      function saveTheme(theme) {
        try {
          localStorage.setItem(themeKey, theme);
        } catch {
          return false;
        }

        return true;
      }

      function applyTheme(theme) {
        document.body.dataset.theme = theme;
        themeToggle.setAttribute("aria-label", theme === "dark" ? "Lichte modus inschakelen" : "Donkere modus inschakelen");
      }

      function startOfDay(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate());
      }

      function toDateInputValue(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function parseLocalDate(value) {
        const [year, month, day] = value.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function dayStamp(date) {
        return startOfDay(date).toISOString();
      }

      function daysUntil(value) {
        const now = startOfDay(new Date());
        const target = parseLocalDate(value);
        return Math.ceil((target - now) / 86400000);
      }

      function sortedEvents() {
        return [...events].sort((a, b) => {
          const aDays = daysUntil(a.date);
          const bDays = daysUntil(b.date);
          const aUpcoming = aDays >= 0;
          const bUpcoming = bDays >= 0;
          if (aUpcoming !== bUpcoming) return aUpcoming ? -1 : 1;
          const dateDiff = aUpcoming
            ? parseLocalDate(a.date) - parseLocalDate(b.date)
            : parseLocalDate(b.date) - parseLocalDate(a.date);
          return dateDiff || a.createdAt - b.createdAt;
        });
      }

      function labelForDays(days) {
        if (days === 0) return "vandaag";
        if (days === 1) return "morgen";
        if (days < 0) return `${Math.abs(days)} ${Math.abs(days) === 1 ? "dag" : "dagen"} geleden`;
        return `over ${days} ${days === 1 ? "dag" : "dagen"}`;
      }

      function render() {
        const today = new Date();
        todayLabel.textContent = formatter.format(today);
        const ordered = sortedEvents();
        eventCount.textContent = `${ordered.length} ${ordered.length === 1 ? "item" : "items"}`;

        if (ordered.length === 0) {
          nextTitle.textContent = "Nog niets gepland";
          nextDate.textContent = "Voeg je eerste datum toe met de plusknop.";
          nextBadge.innerHTML = `<span class="day-number">0</span><span class="day-word">dagen</span>`;
          eventList.innerHTML = `<div class="empty">Je kalender is nog leeg.</div>`;
          return;
        }

        const next = ordered.find((event) => daysUntil(event.date) >= 0) || ordered[ordered.length - 1];
        const nextDays = daysUntil(next.date);
        nextTitle.textContent = next.name;
        nextDate.textContent = `${formatter.format(parseLocalDate(next.date))} - ${labelForDays(nextDays)}`;
        nextBadge.innerHTML = `<span class="day-number">${Math.max(nextDays, 0)}</span><span class="day-word">${Math.abs(nextDays) === 1 ? "dag" : "dagen"}</span>`;

        const listEvents = ordered.filter((event) => event.id !== next.id);
        if (listEvents.length === 0) {
          eventList.innerHTML = `<div class="empty">Geen andere gebeurtenissen.</div>`;
          return;
        }

        eventList.innerHTML = listEvents.map((event) => {
          const date = parseLocalDate(event.date);
          const days = daysUntil(event.date);
          const title = escapeHtml(event.name);
          const isPast = days < 0;
          return `
            <article class="event-card ${isPast ? "is-past" : ""}" data-event-id="${escapeHtml(event.id)}" role="button" tabindex="0" aria-label="${title} bewerken">
              <div class="date-tile" aria-hidden="true">
                <span class="date-month">${shortMonth.format(date).replace(".", "")}</span>
                <span class="date-day">${date.getDate()}</span>
              </div>
              <div>
                <h3 class="event-title">${title}</h3>
                <p class="event-meta">${formatter.format(date)} - ${labelForDays(days)}</p>
              </div>
              <div class="days-left" aria-label="${Math.max(days, 0)} dagen over">
                <strong>${Math.max(days, 0)}</strong>
                <span>${Math.abs(days) === 1 ? "dag" : "dagen"}</span>
              </div>
            </article>
          `;
        }).join("");
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[char]);
      }

      function createId() {
        if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
          return globalThis.crypto.randomUUID();
        }

        return `event-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function showFormError(message) {
        formError.textContent = message;
        formError.dataset.visible = "true";
      }

      function clearFormError() {
        formError.textContent = "";
        formError.dataset.visible = "false";
      }

      function openSheet() {
        const today = new Date();
        editingEventId = null;
        sheetTitle.textContent = "Nieuwe gebeurtenis";
        submitButton.textContent = "Voeg toe";
        deleteEventButton.dataset.visible = "false";
        eventDate.min = toDateInputValue(today);
        eventDate.value = eventDate.min;
        eventName.value = "";
        clearFormError();
        backdrop.dataset.open = "true";
        setTimeout(() => eventName.focus(), 80);
      }

      function openEditSheet(eventToEdit) {
        editingEventId = eventToEdit.id;
        sheetTitle.textContent = "Gebeurtenis bewerken";
        submitButton.textContent = "Bewaar";
        deleteEventButton.dataset.visible = "true";
        eventDate.min = "";
        eventName.value = eventToEdit.name;
        eventDate.value = eventToEdit.date;
        clearFormError();
        backdrop.dataset.open = "true";
        setTimeout(() => eventName.focus(), 80);
      }

      function closeSheet() {
        backdrop.dataset.open = "false";
        clearFormError();
        form.reset();
        editingEventId = null;
      }

      document.querySelector("#openSheet").addEventListener("click", openSheet);
      themeToggle.addEventListener("click", () => {
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(currentTheme);
        saveTheme(currentTheme);
      });
      document.querySelector("#closeSheet").addEventListener("click", closeSheet);
      document.querySelector("#cancelSheet").addEventListener("click", closeSheet);
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) closeSheet();
      });

      eventList.addEventListener("click", (event) => {
        const card = event.target.closest(".event-card");
        if (!card) return;
        const eventToEdit = events.find((item) => item.id === card.dataset.eventId);
        if (eventToEdit) openEditSheet(eventToEdit);
      });

      eventList.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest(".event-card");
        if (!card) return;
        event.preventDefault();
        const eventToEdit = events.find((item) => item.id === card.dataset.eventId);
        if (eventToEdit) openEditSheet(eventToEdit);
      });

      deleteEventButton.addEventListener("click", () => {
        if (!editingEventId) return;
        events = events.filter((item) => item.id !== editingEventId);
        saveEvents();
        closeSheet();
        render();
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = eventName.value.trim();
        const date = eventDate.value;
        if (!name || !date) {
          showFormError("Vul een naam en datum in.");
          return;
        }

        try {
          if (editingEventId) {
            events = events.map((item) => item.id === editingEventId ? { ...item, name, date } : item);
          } else {
            events.push({
              id: createId(),
              name,
              date,
              createdAt: Date.now()
            });
          }
          saveEvents();
          closeSheet();
          render();
        } catch {
          showFormError("Opslaan lukt nu niet. Probeer de pagina opnieuw te laden.");
        }
      });

      setInterval(() => {
        const currentDay = dayStamp(new Date());
        if (currentDay !== lastRenderedDay) {
          lastRenderedDay = currentDay;
          render();
        }
      }, 60000);

      render();
    </script>
  </body>
</html>
